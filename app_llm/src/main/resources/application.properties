# ---------------------------------------------------------------------
# Base de datos (ver ../db/README.md)
#   La app se conecta como app_lector: solo lee las vistas agregadas de
#   "analitica" y escribe en "ia". Nunca ve filas de alumnos.
#   Las contraseñas se leen de variables de entorno (las mismas de .env).
# ---------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/escuela}
quarkus.datasource.username=app_lector
quarkus.datasource.password=${APP_LECTOR_PASSWORD:cambia-lector}
# Usamos nuestro propio PostgreSQL de docker compose, no el de Dev Services
quarkus.datasource.devservices.enabled=false

# Segunda conexión, SOLO para la importación de CSV de docentes (V7):
#   app_ingesta puede insertar en staging.spf_raw y ejecutar los procedimientos
#   de ingesta. No lee analitica ni escribe en tablas analíticas.
quarkus.datasource.ingesta.db-kind=postgresql
quarkus.datasource.ingesta.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/escuela}
quarkus.datasource.ingesta.username=app_ingesta
quarkus.datasource.ingesta.password=${APP_INGESTA_PASSWORD:cambia-ingesta}
quarkus.datasource.ingesta.jdbc.max-size=4
quarkus.datasource.ingesta.devservices.enabled=false

# Flyway migra con el propietario de la base de datos (escuela_admin),
# que es el único que puede crear esquemas, vistas y permisos.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.flyway.jdbc-url=${DB_URL:jdbc:postgresql://localhost:5432/escuela}
quarkus.flyway.username=escuela_admin
quarkus.flyway.password=${ESCUELA_ADMIN_PASSWORD:cambia-admin}

# ---------------------------------------------------------------------
# RAG: Llama (chat) + embeddings servidos por Ollama en local, vectores en pgvector
#   ollama pull llama3.2:3b
#   ollama pull embeddinggemma
# Ollama no publica un modelo de embeddings de Llama y los modelos de chat
# Llama no sirven /api/embed, así que los embeddings van con embeddinggemma
# (multilingüe). Si cambias de modelo de embeddings, ajusta RAG_EMBEDDING_DIM
# y llama a POST /api/rag/ingesta para reindexar.
# ---------------------------------------------------------------------
quarkus.langchain4j.ollama.base-url=${OLLAMA_URL:http://localhost:11434}
# La primera respuesta incluye la carga del modelo en memoria
quarkus.langchain4j.ollama.timeout=300s
# Mac Intel i5 / 16 GB, solo CPU: llama3.2:3b es el equilibrio entre velocidad y calidad.
# Es el perfil "equilibrado" (por defecto). Los otros perfiles, más abajo.
quarkus.langchain4j.ollama.chat-model.model-id=${OLLAMA_CHAT_MODEL:llama3.2:3b}
quarkus.langchain4j.ollama.chat-model.temperature=0.2
# En CPU cada token cuenta: respuestas breves (unas 350 palabras como máximo)
quarkus.langchain4j.ollama.chat-model.num-predict=512
quarkus.langchain4j.ollama.chat-model.model-options.num-ctx=8192
quarkus.langchain4j.ollama.embedding-model.model-id=${OLLAMA_EMBEDDING_MODEL:embeddinggemma}

# ---------------------------------------------------------------------
# Modelos que puede elegir el usuario (GET /api/modelos y campo "modelo"
# de POST /api/asistente):
#   equilibrado → la configuración por defecto de arriba (llama3.2:3b)
#   rapido      → quarkus.langchain4j.ollama.rapido.*  (llama3.2:1b)
#   preciso     → quarkus.langchain4j.ollama.preciso.* (qwen3.5:4b)
# Todos comparten instrucciones, RAG y embeddings: cambiar de modelo NO obliga a reindexar.
# Descargar: ollama pull llama3.2:1b && ollama pull qwen3.5:4b
# ---------------------------------------------------------------------
quarkus.langchain4j.ollama.rapido.base-url=${OLLAMA_URL:http://localhost:11434}
quarkus.langchain4j.ollama.rapido.timeout=300s
quarkus.langchain4j.ollama.rapido.chat-model.model-id=${OLLAMA_MODELO_RAPIDO:llama3.2:1b}
quarkus.langchain4j.ollama.rapido.chat-model.temperature=0.2
quarkus.langchain4j.ollama.rapido.chat-model.num-predict=512
quarkus.langchain4j.ollama.rapido.chat-model.model-options.num-ctx=8192
quarkus.langchain4j.ollama.rapido.embedding-model.model-id=${OLLAMA_EMBEDDING_MODEL:embeddinggemma}

quarkus.langchain4j.ollama.preciso.base-url=${OLLAMA_URL:http://localhost:11434}
quarkus.langchain4j.ollama.preciso.timeout=300s
quarkus.langchain4j.ollama.preciso.chat-model.model-id=${OLLAMA_MODELO_PRECISO:qwen3.5:4b}
quarkus.langchain4j.ollama.preciso.chat-model.temperature=0.2
quarkus.langchain4j.ollama.preciso.chat-model.num-predict=512
quarkus.langchain4j.ollama.preciso.chat-model.model-options.num-ctx=8192
# qwen3.5 puede "pensar" antes de responder: en CPU eso multiplica el tiempo
quarkus.langchain4j.ollama.preciso.chat-model.model-options.think=false
quarkus.langchain4j.ollama.preciso.embedding-model.model-id=${OLLAMA_EMBEDDING_MODEL:embeddinggemma}

# Ollama ya corre en local: sin Dev Services (no levantar contenedores)
quarkus.langchain4j.devservices.enabled=false

# La tabla ia.embeddings la crea Flyway (V6), no la app
quarkus.langchain4j.pgvector.table=ia.embeddings
quarkus.langchain4j.pgvector.create-table=false
quarkus.langchain4j.pgvector.dimension=${RAG_EMBEDDING_DIM:768}

rag.ingesta.al-arrancar=true
# Menos fichas por pregunta = prompt más corto = respuesta mucho antes en CPU
rag.max-resultados=4
rag.score-minimo=0.5

# ---------------------------------------------------------------------
# Usuarios y roles. Contraseñas desde el .env.
#   docente        → su grupo: panel, análisis e importación de CSV, resumen semanal, medidas
#   direccion      → lo anterior para todo su centro + panel de dirección e historial de todo el profesorado
#   administracion → conjunto de centros: panel general, panel de dirección y medidas (solo consulta)
# Fuera de una demo, sustituir por el directorio del centro (OIDC/LDAP).
# ---------------------------------------------------------------------
quarkus.security.users.embedded.enabled=true
quarkus.security.users.embedded.plain-text=true
quarkus.security.users.embedded.users.docente=${DOCENTE_PASSWORD:cambia-docente}
quarkus.security.users.embedded.roles.docente=docente
quarkus.security.users.embedded.users.direccion=${DIRECCION_PASSWORD:cambia-direccion}
quarkus.security.users.embedded.roles.direccion=docente,direccion
quarkus.security.users.embedded.users.administracion=${ADMINISTRACION_PASSWORD:cambia-administracion}
quarkus.security.users.embedded.roles.administracion=administracion

# Navegador: pantalla de login con sesión en cookie (cifrada, HttpOnly, SameSite=Strict).
# Scripts y curl: HTTP Basic (curl -u docente:clave …).
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.login-page=/login.html
quarkus.http.auth.form.error-page=/login.html?error=1
quarkus.http.auth.form.landing-page=/
# Tras el login, siempre a la página principal (no a la petición de la API que caducó)
quarkus.http.auth.form.redirect-after-login=false
quarkus.http.auth.form.timeout=PT8H
quarkus.http.auth.basic=true
# Clave de cifrado de la cookie (SESION_CLAVE, 16+ caracteres). Si no se define, se genera una
# aleatoria al arrancar y reiniciar la app cierra las sesiones abiertas.
quarkus.http.auth.session.encryption-key=${SESION_CLAVE:}

# Público: la pantalla de login y sus recursos. Todo lo demás exige haber iniciado sesión;
# los permisos de cada rol se comprueban además en cada recurso REST (@RolesAllowed).
quarkus.http.auth.permission.publico.paths=/login.html,/css/*,/img/*
quarkus.http.auth.permission.publico.policy=permit
quarkus.http.auth.permission.app.paths=/*
quarkus.http.auth.permission.app.policy=authenticated

# ---------------------------------------------------------------------
# Ingesta de CSV: límites y archivos temporales
#   El archivo se lee en memoria y su temporal se borra al terminar la petición.
#   La vista previa vive solo en memoria y caduca (no se guarda el archivo).
# ---------------------------------------------------------------------
quarkus.http.limits.max-body-size=3M
quarkus.http.body.delete-uploaded-files-on-end=true
quarkus.http.body.uploads-directory=${java.io.tmpdir}/hack4edu-subidas
ingesta.max-bytes=2097152
ingesta.max-filas=5000
ingesta.max-columnas=60
ingesta.minutos-vista-previa=20

# ---------------------------------------------------------------------
# Tests: no requieren PostgreSQL ni Ollama
# ---------------------------------------------------------------------
%test.quarkus.flyway.migrate-at-start=false
%test.rag.ingesta.al-arrancar=false
