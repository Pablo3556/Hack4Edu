# ---------------------------------------------------------------------
# Base de datos (ver ../db/README.md)
#   La app se conecta como app_lector: solo lee las vistas agregadas de
#   "analitica" y escribe en "ia". Nunca ve filas de alumnos.
#   Las contraseñas se leen de variables de entorno (las mismas de .env).
# ---------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/escuela}
quarkus.datasource.username=app_lector
quarkus.datasource.password=${APP_LECTOR_PASSWORD:cambia-lector}
# Usamos nuestro propio PostgreSQL de docker compose, no el de Dev Services
quarkus.datasource.devservices.enabled=false

# Flyway migra con el propietario de la base de datos (escuela_admin),
# que es el único que puede crear esquemas, vistas y permisos.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.flyway.jdbc-url=${DB_URL:jdbc:postgresql://localhost:5432/escuela}
quarkus.flyway.username=escuela_admin
quarkus.flyway.password=${ESCUELA_ADMIN_PASSWORD:cambia-admin}

# ---------------------------------------------------------------------
# RAG: Llama (chat) + embeddings servidos por Ollama en local, vectores en pgvector
#   ollama pull llama3.2:3b
#   ollama pull embeddinggemma
# Ollama no publica un modelo de embeddings de Llama y los modelos de chat
# Llama no sirven /api/embed, así que los embeddings van con embeddinggemma
# (multilingüe). Si cambias de modelo de embeddings, ajusta RAG_EMBEDDING_DIM
# y llama a POST /api/rag/ingesta para reindexar.
# ---------------------------------------------------------------------
quarkus.langchain4j.ollama.base-url=${OLLAMA_URL:http://localhost:11434}
# La primera respuesta incluye la carga del modelo en memoria
quarkus.langchain4j.ollama.timeout=300s
quarkus.langchain4j.ollama.chat-model.model-id=${OLLAMA_CHAT_MODEL:llama3.2:3b}
quarkus.langchain4j.ollama.chat-model.temperature=0.2
quarkus.langchain4j.ollama.chat-model.model-options.num-ctx=8192
quarkus.langchain4j.ollama.embedding-model.model-id=${OLLAMA_EMBEDDING_MODEL:embeddinggemma}
# Ollama ya corre en local: sin Dev Services (no levantar contenedores)
quarkus.langchain4j.devservices.enabled=false

# La tabla ia.embeddings la crea Flyway (V6), no la app
quarkus.langchain4j.pgvector.table=ia.embeddings
quarkus.langchain4j.pgvector.create-table=false
quarkus.langchain4j.pgvector.dimension=${RAG_EMBEDDING_DIM:768}

rag.ingesta.al-arrancar=true
rag.max-resultados=6
rag.score-minimo=0.5

# ---------------------------------------------------------------------
# Tests: no requieren PostgreSQL ni Ollama
# ---------------------------------------------------------------------
%test.quarkus.flyway.migrate-at-start=false
%test.rag.ingesta.al-arrancar=false
