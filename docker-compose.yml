# ---------------------------------------------------------------------
# Ad Astra · La escuela que aprende de sus datos
#
# Un único contenedor con PostgreSQL (pgvector) y la aplicación.
#   cp .env.example .env              (y cambia las contraseñas)
#   docker compose up -d --build      → http://localhost:8080
#
# Los modelos de lenguaje los sirve el Ollama del equipo (OLLAMA_URL), que no va dentro.
# Los datos viven en el volumen "pgdata". Migraciones: las aplica la app al arrancar.
# ---------------------------------------------------------------------
name: adastra

services:
  app:
    build: .
    image: adastra
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      ESCUELA_ADMIN_PASSWORD: ${ESCUELA_ADMIN_PASSWORD:?define ESCUELA_ADMIN_PASSWORD en .env}
      APP_LECTOR_PASSWORD: ${APP_LECTOR_PASSWORD:?define APP_LECTOR_PASSWORD en .env}
      APP_INGESTA_PASSWORD: ${APP_INGESTA_PASSWORD:?define APP_INGESTA_PASSWORD en .env}
      DOCENTE_PASSWORD: ${DOCENTE_PASSWORD:?define DOCENTE_PASSWORD en .env}
      DIRECCION_PASSWORD: ${DIRECCION_PASSWORD:?define DIRECCION_PASSWORD en .env}
      ADMINISTRACION_PASSWORD: ${ADMINISTRACION_PASSWORD:?define ADMINISTRACION_PASSWORD en .env}
      # Centro y grupo de cada usuario (ids de analitica.centro / analitica.grupo)
      DIRECCION_CENTRO: ${DIRECCION_CENTRO:-1}
      DOCENTE_CENTRO: ${DOCENTE_CENTRO:-1}
      DOCENTE_GRUPO: ${DOCENTE_GRUPO:-1}
      # Clave de la cookie de sesión (opcional: sin ella, reiniciar la app cierra las sesiones)
      SESION_CLAVE: ${SESION_CLAVE:-}
      # Carga el dataset de demostración (y reindexa el asistente) la primera vez, si la base está vacía
      CARGAR_DATOS: ${CARGAR_DATOS:-true}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2:3b}
      OLLAMA_MODELO_RAPIDO: ${OLLAMA_MODELO_RAPIDO:-llama3.2:1b}
      OLLAMA_MODELO_PRECISO: ${OLLAMA_MODELO_PRECISO:-qwen3.5:4b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-embeddinggemma}
      RAG_EMBEDDING_DIM: ${RAG_EMBEDDING_DIM:-768}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # necesario en Linux; en Docker Desktop ya existe
    ports:
      - "${APP_PUERTO:-8080}:8080"
      # PostgreSQL solo accesible desde este equipo (desarrollo, psql, scripts)
      - "127.0.0.1:${DB_PUERTO:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d escuela -q && bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s
    stop_grace_period: 40s
    restart: unless-stopped

  # Opcional: aplicar las migraciones con Flyway a mano (la app ya lo hace al arrancar).
  #   docker compose --profile migraciones run --rm migraciones
  migraciones:
    profiles: ["migraciones"]
    image: flyway/flyway:10
    depends_on:
      app:
        condition: service_healthy
    command: >
      -url=jdbc:postgresql://app:5432/escuela
      -user=escuela_admin
      -password=${ESCUELA_ADMIN_PASSWORD}
      -locations=filesystem:/flyway/sql
      -connectRetries=10
      migrate
    volumes:
      - ./app_llm/src/main/resources/db/migration:/flyway/sql:ro

volumes:
  pgdata:
    # Nombre fijo: conserva los datos creados cuando el proyecto se llamaba «hack4edu»
    name: hack4edu_pgdata
